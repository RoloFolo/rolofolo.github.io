<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naberius Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;500&display=swap">
<style>
  :root { --ground: #fbf6ef; --ink: #2a2233; --muted: #6b6076; --ember: #c9432b; }
  @media (prefers-color-scheme: dark) { :root { --ground: #17131d; --ink: #f3ece4; --muted: #b3a8bd; --ember: #ff7a5c; color-scheme: dark; } }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.6 "Fredoka", system-ui, sans-serif; padding: 48px 20px; }
  main { max-width: 40rem; margin: 0 auto; display: grid; gap: 18px; }
  h1 { font: 400 clamp(2.2rem, 7vw, 3rem)/1 "Lilita One", "Arial Black", sans-serif; color: var(--ember); margin: 0; }
  p { margin: 0; }
  a { color: var(--ember); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Naberius Games</h1>
  <p>An independent game studio from the Netherlands, making the real games behind those fake mobile game ads.</p>
  <h2 style="margin:12px 0 0">ImpLegion</h2>
  <p>A lane shooter: a legion of imps spits fireballs at hordes of ad soldiers. <a href="implegion/privacy.html">Privacy policy</a></p>
  <p class="muted">Contact: rolandfolkers@hotmail.com</p>
</main>
</body>
</html>
