<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" class="joop-svg">
  <g stroke="#1b1440" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- suit -->
    <path d="M28 250 C30 205 52 184 100 182 C148 184 170 205 172 250 Z" fill="#7b8396"/>
    <!-- shirt -->
    <path d="M76 186 L100 232 L124 186 C116 182 84 182 76 186 Z" fill="#bcd9ff"/>
    <!-- tie -->
    <path d="M92 190 L108 190 L104 200 L111 236 L100 248 L89 236 L96 200 Z" fill="#a9adb8"/>
    <!-- lapels -->
    <path d="M76 186 L100 232 L84 214 L70 194 Z" fill="#69708a"/>
    <path d="M124 186 L100 232 L116 214 L130 194 Z" fill="#69708a"/>
    <!-- neck -->
    <path d="M86 168 L86 186 C94 192 106 192 114 186 L114 168 Z" fill="#f5c3a0"/>
    <!-- ears -->
    <ellipse cx="38" cy="112" rx="13" ry="18" fill="#f5c3a0"/>
    <ellipse cx="162" cy="112" rx="13" ry="18" fill="#f5c3a0"/>
    <!-- head -->
    <path d="M100 18 C146 18 160 52 160 98 C160 146 134 176 100 176 C66 176 40 146 40 98 C40 52 54 18 100 18 Z" fill="#f8cfae"/>
    <!-- fluffy white hair at the sides -->
    <path d="M44 104 C32 100 30 88 38 82 C30 74 36 62 46 64 C46 56 56 52 62 58 C58 66 58 74 56 80 C54 88 52 96 50 104 Z" fill="#ffffff"/>
    <path d="M156 104 C168 100 170 88 162 82 C170 74 164 62 154 64 C154 56 144 52 138 58 C142 66 142 74 144 80 C146 88 148 96 150 104 Z" fill="#ffffff"/>
  </g>
  <g fill="#ffffff" opacity="0.8"><circle cx="97" cy="206" r="1.6"/><circle cx="103" cy="214" r="1.6"/><circle cx="97" cy="222" r="1.6"/><circle cx="103" cy="230" r="1.6"/><circle cx="99" cy="238" r="1.6"/></g>
  <!-- shine on the bald head -->
  <ellipse cx="80" cy="40" rx="18" ry="9" fill="#ffffff" opacity="0.7" transform="rotate(-18 80 40)"/>
  <!-- cheeks -->
  <ellipse cx="62" cy="128" rx="11" ry="7" fill="#ff8fa8" opacity="0.6"/>
  <ellipse cx="138" cy="128" rx="11" ry="7" fill="#ff8fa8" opacity="0.6"/>
  <g stroke="#1b1440" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- eyebrows, white with an outline -->
    <path d="M60 82 C68 76 80 76 88 81" stroke-width="7"/>
    <path d="M60 82 C68 76 80 76 88 81" stroke="#ffffff" stroke-width="3"/>
    <path d="M112 81 C120 76 132 76 140 82" stroke-width="7"/>
    <path d="M112 81 C120 76 132 76 140 82" stroke="#ffffff" stroke-width="3"/>
    <!-- rimless glasses: thin frames -->
    <rect x="54" y="88" width="40" height="27" rx="9" stroke="#59607a" stroke-width="3" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="106" y="88" width="40" height="27" rx="9" stroke="#59607a" stroke-width="3" fill="#ffffff" fill-opacity="0.35"/>
    <path d="M94 98 C98 95 102 95 106 98" stroke="#59607a" stroke-width="3"/>
    <path d="M54 96 L42 94 M146 96 L158 94" stroke="#59607a" stroke-width="3"/>
  </g>
  <!-- eyes: friendly squints -->
  <g class="eyes-open" fill="#1b1440">
    <ellipse cx="74" cy="102" rx="5" ry="6"/>
    <ellipse cx="126" cy="102" rx="5" ry="6"/>
    <circle cx="76" cy="100" r="1.8" fill="#fff"/>
    <circle cx="128" cy="100" r="1.8" fill="#fff"/>
  </g>
  <g class="eyes-happy" fill="none" stroke="#1b1440" stroke-width="4" stroke-linecap="round">
    <path d="M66 104 C70 96 78 96 82 104"/>
    <path d="M118 104 C122 96 130 96 134 104"/>
  </g>
  <!-- nose -->
  <ellipse cx="100" cy="124" rx="11" ry="9" fill="#f2a98a" stroke="#1b1440" stroke-width="4"/>
  <ellipse cx="96" cy="121" rx="3.5" ry="2.5" fill="#ffffff" opacity="0.7"/>
  <!-- mouth: smile and a talking one -->
  <g class="mouth-smile">
    <path d="M70 142 C82 160 118 160 130 142 C116 150 84 150 70 142 Z" fill="#ffffff" stroke="#1b1440" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <g class="mouth-talk">
    <path d="M74 140 C80 168 120 168 126 140 C112 146 88 146 74 140 Z" fill="#7a1f2f" stroke="#1b1440" stroke-width="4" stroke-linejoin="round"/>
    <path d="M78 141 C90 146 110 146 122 141 L121 146 C108 150 92 150 79 146 Z" fill="#ffffff"/>
    <path d="M88 158 C96 152 106 152 112 158 C104 162 96 162 88 158 Z" fill="#ff7a93"/>
  </g>
  <!-- thumbs up, for congratulations -->
  <g class="thumb" stroke="#1b1440" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M150 250 C150 228 156 214 170 206 L186 224 C178 232 176 240 176 250 Z" fill="#7b8396"/>
    <path d="M160 196 C156 190 160 182 168 184 L180 186 L182 172 C182 162 194 162 194 172 L194 188 C198 190 198 198 194 200 C198 202 197 210 192 212 C194 216 190 222 184 222 L170 222 C162 222 158 214 160 206 Z" fill="#f8cfae"/>
  </g>
</svg>
